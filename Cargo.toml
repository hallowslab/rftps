[package]
name = "rftps"
version = "0.5.0"
edition="2024"
authors = ["HallowsTechLabs hallow.tech.lab@gmail.com"]

[dependencies]
clap = { version = "4.5.30", features = ["derive", "env"] }
tokio = { version = "1.43.0", features = ["full"] }
libunftp = { version = "0.23", features = ["ring"] }
unftp-sbe-fs = "0.4.0"
unftp-core = "0.1"
rand = "0.10.1"
async-trait = "0.1.50"
tempfile = "3.17.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
suppaftp = { version = "8", default-features = false, features = ["tokio-rustls-ring"] }
rustls = "0.23"
tokio-rustls = "0.26"
webpki-roots = "0.26"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
ed25519-dalek = { version = "2", optional = true, features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"], optional = true }
hex = { version = "0.4", optional = true }

[features]
include-pem-files = []
background-jobs = []
relay = ["background-jobs", "dep:reqwest", "dep:ed25519-dalek", "dep:rand_core", "dep:hex"]

[dev-dependencies]
rcgen = "0.13"

# Build optimization for smaller binaries
[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Link-time optimization
codegen-units = 1   # Better optimization
panic = "abort"     # Smaller binary
strip = true        # Remove debug symbols