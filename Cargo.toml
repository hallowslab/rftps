[package]
name = "rftps"
version = "0.6.0"
edition="2024"
authors = ["HallowsTechLabs hallow.tech.lab@gmail.com"]

[dependencies]
clap = { version = "4.6.6", features = ["derive", "env"] }
tokio = { version = "1.53.1", features = ["full"] }
libunftp = { version = "0.23", features = ["ring"] }
unftp-sbe-fs = "0.4.0"
unftp-core = "0.1"
rand = "0.10.2"
async-trait = "0.1.92"
tempfile = "3.27.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
suppaftp = { version = "10", default-features = false, features = ["tokio-rustls-ring"] }
rustls = "0.23"
tokio-rustls = "0.26"
webpki-roots = "1.0.9"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"], optional = true }
ed25519-dalek = { version = "3", optional = true, features = ["rand_core"] }
rand_core = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
aws-sdk-s3 = { version = "1.141.0", optional = true, default-features = false, features = ["rustls", "rt-tokio"] }
aws-smithy-http-client = { version = "1.3.0", optional = true, features = ["default-client", "rustls-ring"] }
aws-smithy-types = { version = "1", optional = true }
percent-encoding = { version = "2", optional = true }
uuid = { version = "1.24", features = ["v4"], optional = true }

[features]
include-pem-files = []
background-jobs = []
broker = ["background-jobs", "dep:reqwest", "dep:ed25519-dalek", "dep:rand_core", "dep:hex"]
s3 = ["background-jobs", "dep:aws-sdk-s3", "dep:aws-smithy-http-client", "dep:aws-smithy-types", "dep:percent-encoding", "dep:uuid"]

[dev-dependencies]
rcgen = "0.14"

# Build optimization for smaller binaries
[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Link-time optimization
codegen-units = 1   # Better optimization
panic = "abort"     # Smaller binary
strip = true        # Remove debug symbols