[package]
name = "rftps"
version = "0.7.0"
edition="2024"
authors = ["HallowsTechLabs hallow.tech.lab@gmail.com"]

[dependencies]
clap = { version = "4.6.6", features = ["derive", "env"] }
tokio = { version = "1.53.1", features = ["full"] }
libunftp = { version = "0.23", features = ["ring"] }
unftp-sbe-fs = "0.4.0"
unftp-core = "0.1"
async-trait = "0.1.92"
tempfile = "3.27.0"
exifflow-core = { git = "https://github.com/hallowslab/exifflow-core", tag = "v0.0.1" }

[features]
include-pem-files = []

[dev-dependencies]
rcgen = "0.14"

# Build optimization for smaller binaries
[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Link-time optimization
codegen-units = 1   # Better optimization
panic = "abort"     # Smaller binary
strip = true        # Remove debug symbols
